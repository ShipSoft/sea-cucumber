#
# Matches the 100-column house style set by .clang-format and CPPLINT.cfg.
line-length = 100

[lint]
# pycodestyle (subset), pyflakes, isort, pyupgrade, bugbear, executable checks.
# flake8-bandit (S) is left out: it flags the try/except/continue in
# tools/dump_hit_z.py, which is deliberate field-probing logic.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "EXE"]
