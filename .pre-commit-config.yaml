# Hooks run via `prek` (see pixi.toml [feature.lint]); tool versions are pinned
# in pixi, so hooks invoke the environment-provided tools as system commands.
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c++, c]
      - id: cpplint
        name: cpplint
        entry: cpplint
        language: system
        types_or: [c++]
      - id: gersemi
        name: gersemi
        entry: gersemi -i
        language: system
        files: (CMakeLists\.txt|\.cmake)$
      - id: cmakelint
        name: cmakelint
        entry: cmakelint --linelength=100
        language: system
        files: (CMakeLists\.txt|\.cmake)$
      - id: codespell
        name: codespell
        entry: codespell -L gaus,astroid
        language: system
        # web/vendor holds the minified three.js build; its identifiers are
        # not English and codespell reports dozens of them.
        exclude: '(pixi\.lock|\.pixi/|build/|^web/vendor/)'
      - id: reuse
        name: reuse
        entry: reuse lint
        language: system
        pass_filenames: false
