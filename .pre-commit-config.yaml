# Hooks run via `prek` (see pixi.toml [feature.lint]); tool versions are pinned
# in pixi, so hooks invoke the environment-provided tools as system commands.
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c++, c]
      - id: cpplint
        name: cpplint
        entry: cpplint
        language: system
        types_or: [c++]
      - id: gersemi
        name: gersemi
        entry: gersemi -i
        language: system
        files: (CMakeLists\.txt|\.cmake)$
      - id: cmakelint
        name: cmakelint
        entry: cmakelint --linelength=100
        language: system
        files: (CMakeLists\.txt|\.cmake)$
      - id: codespell
        name: codespell
        entry: codespell -L gaus,astroid
        language: system
        exclude: '(pixi\.lock|\.pixi/|build/)'
      - id: reuse
        name: reuse
        entry: reuse lint
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: prettier --write --log-level warn
        language: system
        types_or: [javascript, html, css, json, markdown]
        exclude: '^web/(js/)?vendor/'
      - id: eslint
        name: eslint
        entry: eslint --max-warnings=0
        language: system
        types_or: [javascript]
        exclude: '^web/(js/)?vendor/'
      - id: stylelint
        name: stylelint
        entry: stylelint
        language: system
        types_or: [css]
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types_or: [python]
      - id: ruff-check
        name: ruff-check
        entry: ruff check --fix
        language: system
        types_or: [python]
