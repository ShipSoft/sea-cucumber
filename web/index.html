  sea_cucumber web frontend. Four-panel layout mirroring the REve display:
  a control sidebar (left), the main 3D view (centre), and three region views
  (Spectrometer / Calorimeter / SND) stacked on the right. C++ produces the
  display files; this page renders them with three.js. No build step.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sea cucumber</title>
    <link rel="icon" type="image/png" href="logo/sc.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="app">
      <!-- LEFT: control sidebar -->
      <aside class="side">
        <div class="brand">
          <img class="brand__logo" src="logo/sc.png" alt="sea cucumber logo"
               onerror="this.style.visibility='hidden'" />
          <span class="brand__name">sea cucumber</span>
        </div>

        <section class="ctl">
          <h2 class="ctl__h">Event</h2>
          <div class="nav">
            <button id="prev" class="btn" title="Previous event">&#8592;</button>
            <span class="counter"><span id="evNum">–</span> / <span id="evMax">–</span></span>
            <button id="next" class="btn" title="Next event">&#8594;</button>
          </div>
          <dl class="readout">
            <dt>hits</dt><dd id="nHits" class="mono">0</dd>
            <dt>z range</dt><dd id="zRange" class="mono">–</dd>
          </dl>
        </section>

        <section class="ctl">
          <h2 class="ctl__h">Show</h2>
          <label class="toggle"><input type="checkbox" id="tGeo" checked /> geometry</label>
          <label class="toggle"><input type="checkbox" id="tHits" checked /> hits</label>
          <label class="toggle"><input type="checkbox" id="tVertex" checked /> decay vertex</label>
        </section>

        <section class="ctl">
          <h2 class="ctl__h">Views</h2>
          <button id="newView" class="btn btn--wide">+ New view</button>
        </section>

        <section class="ctl">
          <h2 class="ctl__h">Main camera</h2>
          <div class="cams" role="group" aria-label="Main camera">
            <button class="btn btn--ghost" data-cam="3d">3D</button>
            <button class="btn btn--ghost" data-cam="side">Side</button>
            <button class="btn btn--ghost" data-cam="front">Front</button>
            <button class="btn btn--ghost" data-cam="top">Top</button>
          </div>
        </section>

        <div class="side__foot" id="status"></div>
      </aside>

      <!-- CENTRE: main view -->
      <main class="main">
        <canvas id="view-main" class="panel__canvas"></canvas>
        <span class="panel__label">Main</span>
      </main>

      <!-- RIGHT: three region views -->
      <div class="regions">
        <section class="rpanel">
          <canvas id="view-r0" class="panel__canvas"></canvas>
          <span class="panel__label" id="lbl-r0">Spectrometer</span>
        </section>
        <section class="rpanel">
          <canvas id="view-r1" class="panel__canvas"></canvas>
          <span class="panel__label" id="lbl-r1">Calorimeter</span>
        </section>
        <section class="rpanel">
          <canvas id="view-r2" class="panel__canvas"></canvas>
          <span class="panel__label" id="lbl-r2">SND</span>
        </section>
      </div>
    </div>

    <!-- floating user-created views live here, above the fixed grid -->
    <div id="float-layer" class="float-layer"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
