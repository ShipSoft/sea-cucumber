hit_scale = 0.01
ntuple = "events"

scan_depth = 4
region_depth = 5

region_exclude = ['.*straw.*', '.*Fibre.*', '.*tile.*', '.*sensors_.*']

[[region]]
name = "WideA"
title = "DEBUG wide 3D"
xmin = -6000.0
xmax = 6000.0
zmin = 30000.0
zmax = 100000.0
camera = "3d"
max_shapes = 5000
max_transparency = 30

[[region]]
name = "SpectroTest"
title = "DEBUG spectrometer 3D"
xmin = -6000.0
xmax = 6000.0
zmin = 80000.0
zmax = 100000.0
camera = "3d"
max_shapes = 2000
max_transparency = 50

[geometry]
include = ['.*']
exclude = ['.*straw.*', '.*Fibre.*', '.*tile.*', '.*sensors_.*']
max_depth = 3
stop_at_match = true
default_color = "#20428A"
default_transparency = 40

[[geometry.style]]
match = "DecayVolume"
color = "#F1DEBC"      # cream vessel
transparency = 55
[[geometry.style]]
match = "Vessel"
color = "#F1DEBC"
transparency = 55
[[geometry.style]]
match = "Tracker"
color = "#20428A"
transparency = 55
[[geometry.style]]
match = "Magnet"
color = "#20428A"
transparency = 60
[[geometry.style]]
match = "Timing"
color = "#20428A"
transparency = 50
[[geometry.style]]
match = "SBT"
color = "#20428A"
transparency = 80
[[geometry.style]]
match = "ECAL"
color = "#081B3C"
transparency = 45
[[geometry.style]]
match = "HCAL"
color = "#081B3C"
transparency = 50
[[geometry.style]]
match = "MuonShield"
color = "#081B3C"
transparency = 60
[[geometry.style]]
match = "Target"
color = "#C64284"
transparency = 40

[hits]
marker_style = 20
marker_size = 2.5
color_by_energy = true    
color_low = "#F1DEBC"
color_high = "#C64284"

[decay]
draw = true               # truth decay-vertex marker
color = "#F1DEBC"
marker_style = 29         # filled star
marker_size = 3.0
