name: Update web data with new geometry artifact

on:
  repository_dispatch:
    types: [geometry-artifact-ready]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download SHiP Geometry artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.client_payload.artifact_name }}
          path: ./ship_geometry.db
          repository: ShipSoft/Geometry
          run-id: ${{ github.event.client_payload.run_id }}
          github-token: ${{ secrets.GEOMETRY_ARTIFACT_READ_TOKEN }}

      # Restore or install the Pixi environment
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Run sea-cucumber web-data generation
        run: pixi run demo --geometry ./ship_geometry.db
